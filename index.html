<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>UM Currency Converter</title>
</head>

<body>
    <header>
        <div id="header">
            <img id="header-logo" src="assets/images/unmiped_logo_png.png" alt="UM Logo">
            <h1 id="header-text">Currency Converter</h1>
        </div>
    </header>
    <main id="content">
        <div id="conversion-container" class="content-panel">
            <div id="convert-from" class="convert-from-to">
                <label for="amount" class="conversion-labels">Amount</label>
                <div class="input-and-dropdown">
                    <input type="number" id="convert-from-input" class="conversion-input" placeholder="1.00">
                    <select name="currency" id="convert-from-currency" class="currency-dropdown">
                        <option value="USD" selected>USD</option>
                        <option value="EUR">EUR</option>
                    </select>
                </div>
            </div>

            <button id="convert-btn">Convert</button>

            <div id="convert-to" class="convert-from-to">
                <label for="result" class="conversion-labels">Result</label>
                <div class="input-and-dropdown">
                    <input type="number" id="convert-to-input" class="conversion-input" placeholder="1.00">
                    <select name="currency" id="convert-to-currency" class="currency-dropdown">
                        <option value="USD">USD</option>
                        <option value="EUR" selected>EUR</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="quick-rates-container" class="content-panel">
        </div>
        <div id="history-container" class="content-panel">
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
