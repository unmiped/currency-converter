<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>UM Currency Converter</title>
</head>
<body>
    <div id="header">
        <img id="header-logo" src="assets/images/unmiped_logo_png.png" alt="UM Logo">
        <h1 id="header-text">Currency Converter</h1>
    </div>
    <div id="content">
        <div id="convertion-container" class="content-panel">
            <span class="container-header">Conversion</span>
        </div>
        <div id="quick-rates-container" class="content-panel">
            <span class="container-header">Quick rates</span>
        </div>
        <div id="history-container" class="content-panel">
            <span class="container-header">History</span>
        </div>
    </div>
</body>
</html>
